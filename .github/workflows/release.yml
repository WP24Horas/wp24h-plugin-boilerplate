name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example 1.0.0)
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -Eq "^ \* Version:[[:space:]]+$VERSION$" wp24h-plugin-boilerplate.php
          grep -Fq "define( 'WP24H_PLUGIN_BOILERPLATE_VERSION', '$VERSION' );" wp24h-plugin-boilerplate.php
          grep -Fq "Stable tag: $VERSION" readme.txt
          grep -Fq "## [$VERSION]" CHANGELOG.md

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run boilerplate quality checks
        run: composer check:boilerplate

      - name: Build distribution package
        run: bash scripts/build-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp24h-plugin-boilerplate-${{ steps.version.outputs.version }}
          path: dist/wp24h-plugin-boilerplate.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wp24h-plugin-boilerplate.zip --clobber
          else
            gh release create "$TAG" \
              dist/wp24h-plugin-boilerplate.zip \
              --target "$GITHUB_SHA" \
              --title "WP24H Plugin Boilerplate $VERSION" \
              --generate-notes
          fi
